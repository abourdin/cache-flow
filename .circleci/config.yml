version: 2.1
orbs:
  codecov: codecov/codecov@6.0.0

executors:
  node:
    parameters:
      node-version:
        type: string
        default: "24.18.1"
    docker:
      - image: cimg/node:<< parameters.node-version >>

jobs:
  release:
    executor: node
    steps:
      - checkout
      - run:
          name: Release New Version
          command: |
            RELEASE_VERSION=$(node -p -e "require('./package.json').version")
            echo "Releasing version $RELEASE_VERSION"

            # setup git
            git config user.name "Release Script"
            git config user.email "contact@abourdin.com"

            # tag release version
            git tag "release-$RELEASE_VERSION"
            git push origin master --tags

            # prepare development branch
            git fetch
            git checkout develop
            npm version minor -m "Prepared branch for next development iteration"
            git push origin develop
            git checkout -

  prepare-dependencies:
    parameters:
      node-version:
        type: string
        default: "24.18.1"
    executor:
      name: node
      node-version: << parameters.node-version >>
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: dependency-cache-v2-node<< parameters.node-version >>-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules

  build:
    parameters:
      node-version:
        type: string
        default: "24.18.1"
    executor:
      name: node
      node-version: << parameters.node-version >>
    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-v2-node<< parameters.node-version >>-{{ checksum "package-lock.json" }}
      - run:
          name: Build Project
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - ./*
  test:
    parameters:
      node-version:
        type: string
        default: "24.18.1"
    executor:
      name: node
      node-version: << parameters.node-version >>
    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-v2-node<< parameters.node-version >>-{{ checksum "package-lock.json" }}
      - run:
          name: Install Redis
          command: |
            sudo apt-get update
            sudo apt-get install -y redis-server
      - run:
          name: Run tests
          command: npm run test
          no_output_timeout: 10m
      - codecov/upload:
          files: coverage/coverage.json
          disable_search: true
          flags: node<< parameters.node-version >>
      - store_test_results:
          path: test-results

  dry-run-docs:
    parameters:
      node-version:
        type: string
        default: "24.18.1"
    executor:
      name: node
      node-version: << parameters.node-version >>
    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-v2-node<< parameters.node-version >>-{{ checksum "package-lock.json" }}
      - run:
          name: Dry-run doc generation
          command: npm run docs
          no_output_timeout: 5m

  publish:
    executor: node
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Package Project
          command: npm run package
      - run:
          name: Generate JSDoc
          command: |
            mkdir -p ~/.ssh/ && echo -e "Host github.com\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
            git config user.name "Release Script"
            git config user.email "contact@abourdin.com"

            git checkout -B docs

            npm run docs
            git add docs/* && git commit -m "Updating JSDoc"
            git push -f origin docs
      - run:
          name: Publish Project
          command: |
            # Trusted publishing: npm exchanges this OIDC token for short-lived
            # credentials, so no npm token is stored in the project. The aud
            # claim is fixed by npm and is the only claim CircleCI lets us set.
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            cd build/package
            npm publish

workflows:
  build-test:
    jobs:
      - prepare-dependencies:
          name: prepare-dependencies-<< matrix.node-version >>
          matrix:
            parameters:
              node-version: &node-versions ["22.23.2", "24.18.1"]
          filters:
            branches:
              ignore:
                - master
                - docs
      - build:
          requires:
            - prepare-dependencies-24.18.1
      - test:
          name: test-<< matrix.node-version >>
          matrix:
            parameters:
              node-version: *node-versions
          requires:
            - prepare-dependencies-<< matrix.node-version >>
      - dry-run-docs:
          requires:
            - prepare-dependencies-24.18.1
  build-test-publish:
    jobs:
      - release:
          filters:
            branches:
              only:
                - master
      - prepare-dependencies:
          name: prepare-dependencies-<< matrix.node-version >>
          matrix:
            parameters:
              node-version: *node-versions
          requires:
            - release
      - build:
          requires:
            - prepare-dependencies-24.18.1
      - test:
          name: test-<< matrix.node-version >>
          matrix:
            parameters:
              node-version: *node-versions
          requires:
            - prepare-dependencies-<< matrix.node-version >>
      - publish:
          requires:
            - build
            - test-22.23.2
            - test-24.18.1
